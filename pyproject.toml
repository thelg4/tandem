[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The command name is `tandem`; the distribution name avoids an existing PyPI project.
name = "tandem-local"
dynamic = ["version"]
description = "Local-first provenance and durability analysis for Claude Code and Codex working on the same Git repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thel Gunter" }]
keywords = ["claude-code", "codex", "coding-agents", "git", "provenance", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
# No runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/thelg4/tandem"
Documentation = "https://github.com/thelg4/tandem/tree/main/docs"
Issues = "https://github.com/thelg4/tandem/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
tandem = "tandem.cli:main"

[tool.hatch.version]
path = "src/tandem/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"src/tandem/git_reader.py" = ["S603"] # argument-array subprocess is the intended pattern
"tests/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tandem"]
mypy_path = "src"
